version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: moaring-postgres
    environment:
      POSTGRES_DB: moaring
      POSTGRES_USER: moaring
      POSTGRES_PASSWORD: moaring_local
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moaring -d moaring']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
